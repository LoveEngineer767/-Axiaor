<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Axiaor · Discoveryplace</title>
<link rel="icon" href="media/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#000;
  --ink:#f5f5f7;
  --ink-2:rgba(245,245,247,.66);
  --ink-3:rgba(245,245,247,.44);
  --ink-4:rgba(245,245,247,.24);
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --violet:#6d3be6;
  --live:#ff3b30;
  --violet-hi:#7b4cf2;
  --violet-glow:rgba(109,59,230,.55);
  --silver:linear-gradient(180deg,#fdfdfe 0%,#e4e5e9 30%,#b7b9c0 50%,#cfd1d6 68%,#f4f4f6 100%);
  --silver-ink:#0c0c0f;
  --blur:saturate(160%) blur(26px);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);
  --panel-shadow:0 40px 120px -20px rgba(0,0,0,.85);
  --fallback:linear-gradient(160deg,#15151a 0%,#0a0a0c 55%,#050506 100%);
  --t-instant:100ms;
  --t-fast:160ms;
  --t-base:250ms;
  --t-slow:400ms;
  --t-cine:700ms;
  --ease:cubic-bezier(.16,1,.3,1);
  --sb:248px;
  --top:76px;
  --gutter:56px;
  --f-display:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.sb-collapsed{--sb:88px}
@media (max-width:1280px){:root{--gutter:40px}}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark;background:#000;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;min-width:1200px;background:#000;color:var(--ink);font:400 15px/1.55 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0;font-weight:inherit;font-size:inherit}
b,strong{font-weight:500}
img,video{display:block;max-width:100%}
::selection{background:rgba(109,59,230,.55);color:#fff}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.92);outline-offset:3px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font:500 15px/1 var(--f-body);letter-spacing:.005em;white-space:nowrap;user-select:none;transition:transform var(--t-instant) var(--ease),background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),color var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease),filter var(--t-fast) var(--ease)}
.btn:active{transform:scale(.98)}
.btn .ic{width:19px;height:19px}
.btn-sm{height:38px;padding:0 16px;font-size:14px;gap:8px}
.btn-sm .ic{width:17px;height:17px}
.btn-xs{height:32px;padding:0 12px;font-size:12.5px;gap:7px}
.btn-xs .ic{width:15px;height:15px}
.btn-violet{color:#fff;background:var(--violet);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 30px -14px var(--violet-glow)}
.btn-violet:hover{background:var(--violet-hi)}
.btn-violet.is-set{background:rgba(109,59,230,.12);box-shadow:inset 0 0 0 1px rgba(160,130,255,.55)}
.btn-violet.is-set:hover{background:rgba(109,59,230,.24)}
.btn-outline{color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,0) 40%),rgba(255,255,255,.035);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.btn-outline:hover{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,0) 40%),rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.62)}
.ibtn{position:relative;flex:none;width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,0) 40%),rgba(255,255,255,.035);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.26);transition:transform var(--t-instant) var(--ease),background-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.ibtn:hover{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.58)}
.ibtn:active{transform:scale(.94)}
.ibtn.ghost{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.ibtn.ghost:hover{background:rgba(255,255,255,.08);box-shadow:none}
.ibtn.sm{width:36px;height:36px}
.ibtn.sm .ic{width:18px;height:18px}
.ibtn.glass{background:rgba(10,10,12,.42);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.ibtn.glass:hover{background:rgba(30,30,36,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.ibtn.on{color:#fff;background:rgba(255,255,255,.12)}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font:500 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,0) 40%),rgba(8,8,10,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);white-space:nowrap}
.pill .ic{width:13px;height:13px;stroke-width:1.9}
.pill-live{font-weight:600;background:var(--live)}
.pill-live .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:breathe 1.6s ease-in-out infinite}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px rgba(255,59,48,.75);animation:breathe 1.6s ease-in-out infinite;flex:none}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.6}}
.eyebrow{font:500 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.sec-tag{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--violet);color:#fff}
.sec-tag .ic{width:10px;height:10px;stroke-width:2.6}

.sb{position:fixed;top:0;bottom:0;left:0;width:var(--sb);z-index:40;background:#000;display:flex;flex-direction:column;padding:24px 16px 18px;transition:width var(--t-base) var(--ease)}
.sb>*{flex-shrink:0}
.sb-head{height:40px;display:flex;align-items:center;padding-left:12px;margin-bottom:30px;overflow:hidden}
.logo-slot{display:flex;align-items:center;height:36px;min-width:32px;padding:0 4px}
.logo-full{height:28px;width:auto;display:block}
.logo-mk{height:24px;width:auto;display:none}
body.sb-collapsed .logo-full{display:none}
body.sb-collapsed .logo-mk{display:block}
.sb-toggle{position:absolute;top:28px;right:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:#0b0b0d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);z-index:3;transition:color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),transform var(--t-instant) var(--ease)}
.sb-toggle:hover{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}
.sb-toggle:active{transform:scale(.92)}
.sb-toggle .ic{width:15px;height:15px;stroke-width:2;transition:transform var(--t-base) var(--ease)}
body.sb-collapsed .sb-toggle .ic{transform:rotate(180deg)}
.sb-nav{position:relative;display:flex;flex-direction:column;gap:2px}
.sb-ind{position:absolute;left:0;right:0;top:0;height:44px;border-radius:12px;background:rgba(255,255,255,.085);transition:transform var(--t-base) var(--ease),opacity var(--t-fast) var(--ease);pointer-events:none}
.sb-item{position:relative;z-index:1;display:flex;align-items:center;gap:15px;height:44px;padding:0 0 0 18px;border-radius:12px;color:var(--ink-2);font:500 15px/1 var(--f-body);white-space:nowrap;overflow:hidden;transition:color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
.sb-item:hover{color:var(--ink);background:rgba(255,255,255,.035)}
.sb-item.on{color:var(--ink)}
.sb-item .ic{width:20px;height:20px;overflow:visible}
.sb-item .ic-on{display:none}
.sb-item.on.has-on .ic-off{display:none}
.sb-item.on.has-on .ic-on{display:block}
.sb-item.sb-label{cursor:default}
.sb-item.sb-label:hover{color:var(--ink-2);background:none}
.lbl{transition:opacity calc(var(--t-base) * .4) var(--ease)}
body.sb-collapsed .sb .lbl{opacity:0;pointer-events:none}
.sb-badge{margin-left:auto;margin-right:12px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ink);color:#000;font:500 11px/20px var(--f-body);text-align:center}
.sb-badge.live{background:var(--live);color:#fff;display:inline-flex;align-items:center;gap:5px;padding:0 8px}
.sb-badge.live .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:breathe 1.6s ease-in-out infinite}
.sb-foot{margin-top:auto}
.me{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px;border-radius:14px;white-space:nowrap;overflow:hidden}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:500 14px/1 var(--f-display);color:#fff;background:radial-gradient(120% 120% at 25% 15%,#4a4a55 0%,#1b1b20 55%,#0d0d10 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.me .who{display:flex;flex-direction:column;gap:3px;text-align:left}
.me .who b{font:500 14px/1 var(--f-body)}
.me .who small{font:400 12.5px/1 var(--f-body);color:var(--ink-3)}
.tip{position:fixed;z-index:90;padding:7px 11px;border-radius:9px;background:#18181c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.5);font:500 13px/1 var(--f-body);white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.tip.on{opacity:1;transform:none}

.top{position:fixed;top:0;left:var(--sb);right:0;height:var(--top);z-index:30;display:flex;align-items:center;gap:24px;padding:0 var(--gutter);transition:left var(--t-base) var(--ease)}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(0,0,0,.78);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 -1px 0 var(--line);opacity:0;transition:opacity var(--t-base) var(--ease)}
.top.solid::before{opacity:1}
.greet{font:500 15px/1 var(--f-display);color:var(--ink);letter-spacing:.005em;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:0}
.search{position:relative;flex:1;max-width:620px;margin-left:auto}
.intel-field{display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:999px;color:var(--ink-2);background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,0) 40%),rgba(255,255,255,.035);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:box-shadow var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.intel-field:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.36)}
.intel-field:focus-within{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.58)}
.intel-field .ic{width:18px;height:18px}
.intel-field input{flex:1;min-width:0;height:100%;font:400 14.5px/1 var(--f-body);color:var(--ink);background:none;border:0;outline:0}
.intel-field input::placeholder{color:var(--ink-3)}
.intel-pop{position:absolute;top:calc(100% + 10px);left:0;right:0;z-index:5;display:none;padding:16px;border-radius:22px;background:#0e0e11;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 30px 80px -10px rgba(0,0,0,.8);max-height:calc(100vh - 120px);overflow-y:auto;scrollbar-width:none}
.intel-pop.open{display:block}
.ip-try{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ip-try .lab{font:500 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.ip-think{padding:4px 2px;font:400 14px/1.3 var(--f-body);color:var(--ink-3)}
.ip-none{padding:2px 2px 14px;font:400 14.5px/1.4 var(--f-body);color:var(--ink-2)}
.ip-rows{display:flex;flex-direction:column;margin:-6px}
.ip-row{display:flex;align-items:center;gap:12px;width:100%;padding:6px 8px;border-radius:10px;text-align:left;color:var(--ink)}
.ip-row:hover{background:rgba(255,255,255,.07)}
.ip-th{position:relative;flex:none;width:40px;height:40px;border-radius:8px;overflow:hidden;background:#141418}
.ip-th .frame{position:absolute;inset:0}
.ip-n{flex:1;min-width:0;font:500 14px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip-l{flex:none;font:400 12.5px/1 var(--f-body);color:var(--ink-3)}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:#000;font:500 10.5px/18px var(--f-body);text-align:center;box-shadow:0 0 0 2px #000;transform:scale(0);transition:transform var(--t-base) var(--ease)}
.badge.show{transform:scale(1)}
.pop{position:fixed;top:calc(var(--top) - 6px);right:var(--gutter);width:380px;z-index:85;border-radius:20px;background:rgba(14,14,17,.9);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 30px 80px -10px rgba(0,0,0,.8);padding:16px 18px 14px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity var(--t-base) var(--ease),transform var(--t-base) var(--ease)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop-h{display:flex;align-items:baseline;gap:10px;font:500 15px/1 var(--f-display);margin-bottom:6px;padding:0 2px}
.pop-h span{font:500 12.5px/1 var(--f-body);color:var(--ink-3)}
.pop-row{display:flex;align-items:center;gap:12px;padding:11px 2px;box-shadow:inset 0 -1px 0 var(--line)}
.pop-row:last-child{box-shadow:none}
.pop-media{position:relative;width:64px;height:36px;overflow:hidden;flex:none}
.pop-media.round{width:44px;height:44px;border-radius:50%}
.pop-row .m{flex:1;min-width:0}
.pop-row b{display:block;font:500 14px/1.25 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-row small{display:block;font:400 12.5px/1.3 var(--f-body);color:var(--ink-2);margin-top:3px}
.pop-price{font:500 14px/1 var(--f-body);white-space:nowrap}
.pop-empty{color:var(--ink-3);font-size:13.5px;padding:8px 2px 6px}
.linkbtn{font:500 13px/1 var(--f-body);color:var(--ink-3);padding:6px 2px;white-space:nowrap;transition:color var(--t-fast) var(--ease)}
.linkbtn:hover{color:var(--ink)}
.notes{position:fixed;top:88px;right:24px;z-index:96;display:flex;flex-direction:column;gap:12px;width:480px;pointer-events:none}
.note{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:rgba(18,18,22,.8);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 30px 80px -20px rgba(0,0,0,.9);pointer-events:auto;animation:noteIn var(--t-slow) var(--ease) both}
.note.out{animation:noteOut var(--t-base) var(--ease) both}
@keyframes noteIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes noteOut{to{opacity:0;transform:translateX(16px)}}
.note-media{position:relative;width:88px;height:50px;overflow:hidden;flex:none}
.note-body{flex:1;min-width:0}
.note-k{display:flex;align-items:center;gap:8px;font:500 14px/1.2 var(--f-body);min-width:0}
.note-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-t{font:400 13.5px/1.3 var(--f-body);color:var(--ink-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-act{display:flex;align-items:center;gap:6px}
html.lock .notes{opacity:0;pointer-events:none}

.main{position:relative;margin-left:var(--sb);min-height:100vh;transition:margin-left var(--t-base) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.frame{position:relative;overflow:hidden;background:#0a0a0c;background-image:var(--fallback);isolation:isolate}
.frame>.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame>img.media{opacity:0;transition:opacity var(--t-slow) var(--ease),filter var(--t-fast) var(--ease)}
.frame>img.media.ready{opacity:1}
.frame>video.media{transition:filter var(--t-fast) var(--ease)}
.hero-media>.frame,.st-media>.frame,.mclip>.frame,.mbg>.frame,.note-media>.frame,.pop-media>.frame,.up-media>.frame{position:absolute;inset:0}
.pm{position:absolute;inset:0;display:block;overflow:hidden;background:#141418;border-radius:inherit}
.pm>.pimg{position:absolute;inset:10%;width:80%;height:80%;object-fit:contain}
.ti-media{position:relative;width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none}

.hero{position:relative;height:min(calc((100vw - var(--sb)) * 9 / 16),calc(100vh - 48px));min-height:480px;isolation:isolate;transition:height var(--t-base) var(--ease)}
.hero-media{position:absolute;inset:0;z-index:-2;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.4) 22%,rgba(0,0,0,0) 50%),linear-gradient(0deg,#000 0%,rgba(0,0,0,.9) 7%,rgba(0,0,0,.55) 18%,rgba(0,0,0,.15) 32%,rgba(0,0,0,0) 44%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 14%)}
.hero-body{position:absolute;left:var(--gutter);right:var(--gutter);bottom:64px;display:flex;flex-direction:column;align-items:flex-start;gap:22px;animation:rise var(--t-slow) var(--ease) backwards}
.hero-live{margin-bottom:-8px}
.hero-title{font:400 clamp(34px,3.2vw,52px)/1.05 var(--f-display);letter-spacing:-.03em;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.trend{position:relative;z-index:2;margin-top:-24px;padding:0 var(--gutter)}
.trend-h{font:500 22px/1.2 var(--f-display);letter-spacing:-.015em;margin-bottom:14px}
.trend-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tr{display:flex;align-items:center;gap:14px;min-width:0;padding:4px 20px;text-align:left;cursor:pointer;border-left:1px solid rgba(255,255,255,.14)}
.tr:first-child{border-left:0;padding-left:0}
.tr:last-child{padding-right:0}
.tr-img{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;transition:transform var(--t-fast) var(--ease)}
.tr-img .frame{position:absolute;inset:0}
.tr:hover .tr-img{transform:scale(1.04)}
.tr:active .tr-img{transform:scale(.98)}
.tr-t{min-width:0;display:flex;flex-direction:column;gap:6px}
.tr-e{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-n{font:500 15px/1.15 var(--f-body);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-m{font:400 13px/1.15 var(--f-body);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm>.pimg.thumb{inset:0;width:100%;height:100%;object-fit:cover}
.band .band-img.thumb{inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.rows{padding-bottom:120px}

.row{position:relative;margin-top:48px}
.rows>.row:first-child{margin-top:28px}
.row-head{display:flex;align-items:baseline;gap:12px;padding:0 var(--gutter);margin-bottom:14px}
.row-head h2{font:500 22px/1.2 var(--f-display);letter-spacing:-.015em}
.row-track{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;overflow-y:hidden;padding:6px var(--gutter) 10px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-mask:linear-gradient(90deg,rgba(0,0,0,0) 0,#000 calc(var(--gutter) - 10px),#000 calc(100% - var(--gutter) + 4px),rgba(0,0,0,0) 100%);mask:linear-gradient(90deg,rgba(0,0,0,0) 0,#000 calc(var(--gutter) - 10px),#000 calc(100% - var(--gutter) + 4px),rgba(0,0,0,0) 100%)}
.row-track::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;display:block;text-align:left;cursor:default;transition:transform var(--t-fast) var(--ease)}
.card .frame{border-radius:0}
.card:hover .frame>.media{filter:brightness(1.03)}
.card.is-wired{cursor:pointer}
.card.is-wired:hover{transform:translateY(-2px)}
.card.is-wired:hover .frame>.media{filter:brightness(1.07)}
.card.is-wired:active{transform:translateY(-2px) scale(.98)}
.card-line{margin-top:10px;font:400 14.5px/1.3 var(--f-body);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--t-fast) var(--ease)}
.card:hover .card-line{color:#fff}
.card--prod .card-line,.card--capsule .card-line{color:#fff}
.card-remind{margin-top:8px}
.card-top{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:7}
.card.is-live .card-play{top:auto;bottom:12px}
.card-when{margin-top:4px;font:400 12.5px/1.3 var(--f-body);color:var(--ink-2);white-space:nowrap}
.card.is-tile{cursor:pointer}
.card.is-tile:hover{transform:translateY(-2px)}
.card.is-tile:hover .frame>.media{filter:brightness(1.07)}
.card.is-tile:active{transform:translateY(-2px) scale(.98)}
.pk-item{cursor:pointer}
.pk-item:hover{transform:translateY(-2px)}
.pk-item:hover .frame>.media{filter:brightness(1.07)}
.pk-track .card--cine{width:400px}
/* Creators popups: five circles at the capsule-page size, spread evenly across the fixed card width. */
.pk-track .card--round{width:200px}
.pk-track .card--round .frame{width:176px;height:176px}
.pk-track:has(.card--round){justify-content:space-between}
.card-viewers{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--f-body);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.card-viewers .ic{width:15px;height:15px}
.card-play{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--violet);color:#fff;z-index:7;box-shadow:0 10px 24px -8px var(--violet-glow);opacity:0;transform:translateY(-2px);transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.card-play .ic{width:17px;height:17px;margin-left:2px;fill:#fff;stroke:#fff}
.card.is-wired:hover .card-play,.card.is-wired:focus-visible .card-play{opacity:1;transform:none}
.card--cine{width:clamp(440px,32vw,520px)}
.card--cine .frame{aspect-ratio:2/1}
.card--tall{width:clamp(190px,14vw,220px)}
.card--tall .frame{aspect-ratio:9/16}
.card--round{width:150px;text-align:center}
.card--round .frame{width:136px;height:136px;margin:0 auto;border-radius:50%;overflow:visible}
.card--round .frame>.media{border-radius:50%}
.card--round.is-live .frame{box-shadow:0 0 0 2px #000,0 0 0 4px var(--violet)}
.card--round .card-line{margin-top:16px;text-align:center}
.card-cat{font:500 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:7px;text-align:center}
.card--round .card-play{right:0;top:0;width:36px;height:36px}
/* Home Creators row: eight category circles sized so they fill the row edge to edge and the track still scrolls. */
#rows .card--round{width:calc((100% - 112px) / 7.5)}
#rows .card--round .frame{width:calc(100% - 12px);height:auto;aspect-ratio:1}

.ia{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:center;animation:rise var(--t-slow) var(--ease) backwards}
.ia-img{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0a0a0c}
.ia-img .frame{position:absolute;inset:0}
.ia-t{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.ia-e{font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ia-n{font:500 22px/1.2 var(--f-display);letter-spacing:-.015em;color:#fff}
.ia-l{font:400 14.5px/1.3 var(--f-body);color:var(--ink-2)}
.ia-t .btn{margin-top:8px;height:44px}
.pk{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center}
.pk.open{display:flex}
.pk-bd{position:absolute;inset:0;background:rgba(0,0,0,.72);animation:fadeIn var(--t-slow) var(--ease) both}
.pk-card{position:relative;z-index:1;width:1296px;max-width:calc(100vw - 96px);background:#0a0a0c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 40px 120px -20px rgba(0,0,0,.9);padding:24px 0 28px;animation:pkIn var(--t-slow) var(--ease) both}
@keyframes pkIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes pkOut{to{opacity:0;transform:scale(.97)}}
.pk.closing .pk-bd{animation:fadeOut var(--t-base) var(--ease) both}
.pk.closing .pk-card{animation:pkOut var(--t-base) var(--ease) both}
.pk-head{display:flex;align-items:center;gap:14px;padding:0 32px;margin-bottom:16px}
.pk-title{display:flex;flex-direction:column;gap:9px}
.pk-head h2{font:500 22px/1.2 var(--f-display);letter-spacing:-.015em}
.pk-head .ibtn{margin-left:auto}
.pk-track{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;overflow-y:hidden;padding:6px 32px 8px;scrollbar-width:none;overscroll-behavior-x:contain}
.pk-track::-webkit-scrollbar{display:none}
.pk-track .card{animation:rise var(--t-slow) var(--ease) backwards;animation-delay:calc(var(--i,0) * 40ms)}
.pk-empty{padding:12px 32px 4px;color:var(--ink-3);font-size:14px}

/* Capsule profile pages (Brand / Artist / Creator). One full-screen view like the Stage, with its own scroll,
   a back button and a sticky row of section tabs. Rows reuse the home pieces; the page just has a wider gutter. */
.pf{position:fixed;inset:0;z-index:56;background:#000;display:none;overflow:clip;--gutter:96px}
.pf.open{display:block;animation:pfIn var(--t-cine) var(--ease) both}
.pf.closing{animation:layOut var(--t-slow) var(--ease) both}
@keyframes pfIn{from{opacity:0;transform:scale(1.012)}to{opacity:1;transform:none}}
.pf-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.pf-back{position:absolute;top:21px;left:28px;z-index:6}
.pf-hero{position:relative;height:min(58vw,calc(100vh - 140px));min-height:560px;isolation:isolate}
.pf-media{position:absolute;inset:0;z-index:-2;overflow:hidden}
.pf-media>.frame{position:absolute;inset:0}
.pf-hero.is-portrait .pf-media>.frame{inset:-12%;filter:blur(56px) brightness(.5)}
.pf-hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.4) 22%,rgba(0,0,0,0) 50%),linear-gradient(0deg,#000 0%,rgba(0,0,0,.9) 7%,rgba(0,0,0,.55) 18%,rgba(0,0,0,.15) 32%,rgba(0,0,0,0) 44%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 14%)}
.pf-hero-body{position:absolute;left:var(--gutter);right:var(--gutter);bottom:0;display:flex;align-items:flex-end;gap:44px;padding-bottom:40px;animation:rise var(--t-cine) var(--ease) backwards}
.pf-portrait{position:relative;flex:none;width:280px;height:280px;border-radius:50%;overflow:hidden;background:#141418;box-shadow:0 40px 100px -24px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.14)}
.pf-portrait .frame{position:absolute;inset:0;border-radius:50%}
.pf-text{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0;flex:1}
.pf-name{font:400 clamp(48px,5.4vw,88px)/1 var(--f-display);letter-spacing:-.035em;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-label{font:500 12px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.pf-line{font:400 18px/1.4 var(--f-body);color:#fff}
/* Facts row under the hero line (Artist pages): the two metrics that stay; the rest of `metrics` is data only. */
.pf-facts{display:flex;align-items:baseline;gap:32px}
.pf-fact{display:inline-flex;align-items:baseline;gap:10px}
.pf-fact .k{font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pf-fact b{font:500 15px/1 var(--f-body);color:#fff}
.pf-bio{font:400 17px/1.5 var(--f-body);color:var(--ink-2);max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pf-actions{display:flex;align-items:center;gap:12px;margin-top:10px}
.pf-tabs{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px var(--gutter);overflow-x:auto;scrollbar-width:none;transition:background-color var(--t-base) var(--ease),box-shadow var(--t-base) var(--ease)}
.pf-tabs::-webkit-scrollbar{display:none}
.pf-tabs.stuck{background:rgba(0,0,0,.78);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 -1px 0 var(--line)}
.pf-tab{flex:none;height:40px;padding:0 18px;border-radius:999px;font:500 14.5px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;transition:color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
.pf-tab:hover{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.36)}
.pf-tab.on{color:var(--ink);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.pf-body{padding:8px 0 80px}
.pf .row{margin-top:72px}
.pf-body>.row:first-child{margin-top:40px}
.pf .row-head h2{font-size:26px}
.pf .card,.pf .row-head,.pf .pf-song,.pf .pf-metric,.pf .pf-about,.pf .pf-loc,.pf .pfl-frame,.pf .pfl-under,.pf .pfl-panel,.pf .pfl-ev,.pf .pfl-caps{animation:rise var(--t-slow) var(--ease) backwards;animation-delay:calc(var(--i,0) * 28ms)}
.pf .card--tall{width:clamp(220px,16vw,260px)}
.pf .card--round{width:200px}
.pf .card--round .frame{width:176px;height:176px}
.pf .card-remind{margin-top:10px}
/* Live events module: a 16/9 stage (the event live now, else the nearest upcoming) beside an
   Upcoming panel exactly as tall as the stage — a snapping day wheel and the selected day's list. */
.pfl{display:grid;grid-template-columns:3fr 2fr;gap:0 24px;padding:0 var(--gutter)}
.pfl-frame{display:block;width:100%;position:relative;grid-area:1/1}
.pfl-frame .frame{aspect-ratio:16/9}
button.pfl-frame{cursor:pointer}
.pfl-top{left:14px;right:auto}
.pfl-under{grid-area:2/1;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-top:14px}
.pfl-meta{min-width:0}
.pfl-title{font:500 17px/1.3 var(--f-body);color:#fff}
.pfl-sub{margin-top:4px;font:400 14px/1.3 var(--f-body);color:var(--ink-3)}
.pfl-about{margin-top:8px;font:400 14px/1.45 var(--f-body);color:var(--ink-2);max-width:560px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pfl-act{flex:none}
/* The selected event's products, as the Stage end-screen pills. */
.pfl-caps{grid-area:3/1;display:flex;align-items:center;gap:20px;margin-top:18px;min-width:0}
.pfl-caps>.eyebrow{flex:none}
.pfl-caps-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.pfl-caps-row::-webkit-scrollbar{display:none}
.pfl-panel{grid-area:1/2;position:relative;min-width:0}
.pfl-pin{position:absolute;inset:0;display:flex;flex-direction:column}
.pfl-pin>.eyebrow{margin-bottom:14px}
.pfl-cols{flex:1;display:flex;gap:20px;min-height:0}
.pfl-wheel{position:relative;width:64px;flex:none;overflow-y:auto;scrollbar-width:none;scroll-snap-type:y mandatory;-webkit-mask:linear-gradient(180deg,#000 0,#000 70%,rgba(0,0,0,0) 100%);mask:linear-gradient(180deg,#000 0,#000 70%,rgba(0,0,0,0) 100%)}
.pfl-wheel::-webkit-scrollbar{display:none}
.pfl-wheel::after{content:"";display:block;height:calc(100% - 64px)} /* padding-bottom: wheel height − one cell, so the last day can reach the top */
.pfl-cell{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;width:100%;height:64px;scroll-snap-align:start;opacity:.2;cursor:pointer;transition:opacity var(--t-fast) var(--ease)}
.pfl-cell .d{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pfl-cell .n{font:400 22px/1 var(--f-display);color:#fff}
.pfl-cell.near{opacity:.45}
.pfl-cell.on{opacity:1}
.pfl-daylist{flex:1;min-width:0;overflow-y:auto;scrollbar-width:none}
.pfl-daylist::-webkit-scrollbar{display:none}
.pfl-ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:16px;height:auto;min-height:88px;padding:12px 10px;cursor:pointer;transition:background-color var(--t-fast) var(--ease)}
.pfl-ev:hover{background:rgba(255,255,255,.04)}
.pfl-ev.on{background:rgba(255,255,255,.07)}
.pfl-ev+.pfl-ev{box-shadow:inset 0 1px 0 var(--line)}
.pfl-ev .tm{font:400 15px/1 var(--f-body);color:var(--ink-2);white-space:nowrap}
.pfl-ev .tt{min-width:0;display:flex;flex-direction:column;gap:4px}
.pfl-ev .tt b{display:flex;align-items:center;gap:8px;font:500 15px/1.2 var(--f-body);color:#fff;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfl-ev .ab{display:block;font:400 13px/1.3 var(--f-body);font-style:normal;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfl-ev .tt small{font:400 13px/1.2 var(--f-body);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfl-ev .act{justify-self:end}
/* Brand Partnerships */
.card--ptn{width:248px}
.card--ptn .frame{aspect-ratio:4/5}
.card--ptn .card-line{color:#fff;font-weight:500}
.ptn-logo{position:absolute;top:14px;left:14px;width:24px;height:24px;z-index:7;filter:drop-shadow(0 1px 6px rgba(0,0,0,.5))}
.ptn-logo svg{display:block;width:100%;height:100%}
.card-sub{margin-top:3px;font:400 13px/1.3 var(--f-body);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Music videos (Artist page) */
.card--mv{width:calc((100% - 32px)/3)}
.card--mv .frame{aspect-ratio:16/9}
.card--mv .card-line{font-size:15px;color:#fff}
.card--mv:hover .card-play{opacity:1;transform:none}
/* Brand page: Collections pair, Advert, square people tiles, film stills */
.pf-cols{display:flex;gap:16px;padding:0 var(--gutter)}
.card--col{width:calc((100% - 16px)/2)}
.card--col .frame{aspect-ratio:5/4}
.pf-band{margin-top:72px;padding:0 var(--gutter)}
.card--ad{width:100%}
.card--ad .frame{aspect-ratio:16/9}
.card--sq{width:calc((100% - 64px)/5)}
.card--sq .frame{aspect-ratio:1/1}
.card--sq .card-cat{text-align:left}
.card--film{width:calc((100% - 32px)/3)}
.card--film .frame{aspect-ratio:16/9}
.pf-sec .row-head .linkbtn{margin-left:auto}
.pf-group{margin-top:28px}
.pf-group .eyebrow{display:block;padding:0 var(--gutter);margin-bottom:10px}
.card--prod{width:clamp(220px,17vw,260px)}
.card--prod.is-big{width:clamp(320px,26vw,400px)}
.pf-art{position:relative;aspect-ratio:1;overflow:hidden;background:#141418;border-radius:0}
.card--capsule{width:250px;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.card--capsule .cap-body{pointer-events:none}
.card--capsule .cap-in{animation:capFloat 5s ease-in-out infinite}
.card--capsule .card-line,.card--capsule .card-price{max-width:100%;text-align:center}
.card--capsule .card-line{margin-top:18px}
.card-price{margin-top:4px;font:300 13px/1.2 var(--f-display);color:var(--ink-2);white-space:nowrap}
.pf-songs{padding:0 calc(var(--gutter) - 16px)}
.pf-song{display:grid;grid-template-columns:36px 64px minmax(0,1fr) minmax(0,.9fr) 170px 150px;align-items:center;gap:22px;height:76px;padding:0 16px;border-radius:14px;transition:background-color var(--t-fast) var(--ease)}
.pf-song:hover{background:rgba(255,255,255,.05)}
/* Popular play state: number → play icon on hover, violet equaliser while playing (visual only, no audio). */
.pf-song[data-act]{cursor:pointer}
.pf-song .sn,.pf-song .sp,.pf-song .se{font-style:normal}
.pf-song .sp,.pf-song .se{display:none;color:#fff}
.pf-song .sp svg{width:14px;height:14px}
.pf-song[data-act]:hover .sn{display:none}
.pf-song[data-act]:hover .sp{display:inline-flex}
.pf-song.is-playing,.pf-song.is-paused{background:rgba(255,255,255,.05)}
.pf-song.is-playing .sn,.pf-song.is-paused .sn{display:none}
.pf-song.is-playing .se,.pf-song.is-paused .se{display:inline-flex}
.pf-song.is-playing:hover .sp{display:none}
.pf-song.is-paused:hover .se{display:none}
.pf-song.is-paused:hover .sp{display:inline-flex}
.pf-song.is-playing .t{color:var(--violet-hi)}
.se{align-items:flex-end;gap:2px;height:18px}
.se b{width:3px;height:10px;background:var(--violet-hi);animation:eq .9s ease-in-out infinite alternate}
.se b:nth-child(2){animation-delay:.3s;height:16px}
.se b:nth-child(3){animation-delay:.6s;height:7px}
.pf-song.is-paused .se b{animation-play-state:paused}
@keyframes eq{from{height:6px}to{height:18px}}
.pf-song-h{height:44px;box-shadow:inset 0 -1px 0 var(--line);border-radius:0;margin:0 16px 6px;padding:0}
.pf-song-h:hover{background:none}
.pf-song-h span{font:500 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.pf-song .n{font:500 15px/1 var(--f-body);color:var(--ink-3)}
.pf-song .art{position:relative;width:64px;height:64px;overflow:hidden;background:#141418}
.pf-song .art .frame{position:absolute;inset:0}
.pf-song .t{font:500 17px/1.2 var(--f-body);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-song .c,.pf-song .p,.pf-song .r{font:400 15px/1 var(--f-body);color:var(--ink-2);white-space:nowrap}
.pf-song .r{text-align:right}
.pf-about{padding:0 var(--gutter);max-width:860px;font:400 19px/1.55 var(--f-body);color:var(--ink-2)}
.pf-about + .pf-loc{margin-top:36px}
.pf-loc + .pf-metrics,.pf-about + .pf-metrics{margin-top:40px}
.pf-loc{padding:0 var(--gutter);display:flex;align-items:center;gap:14px;font:400 26px/1.2 var(--f-display);letter-spacing:-.015em;color:#fff}
.pf-loc .ic{width:22px;height:22px;color:var(--ink-2)}
.pf-metrics{display:flex;margin:0 var(--gutter)}
.pf-metric{flex:1 1 auto;min-width:0;padding:6px 24px;border-left:1px solid rgba(255,255,255,.14)}
.pf-metric:first-child{border-left:0;padding-left:0}
.pf-metric .k{font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-metric .v{margin-top:14px;font:400 clamp(24px,1.8vw,30px)/1.1 var(--f-display);letter-spacing:-.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-menu{margin:88px var(--gutter) 0;padding-top:28px;display:flex;flex-wrap:wrap;gap:8px 36px;box-shadow:inset 0 1px 0 var(--line)}
.pf-menu .linkbtn{font-size:15px;padding:6px 0}
.pf-scroll:focus-visible{outline:none}
.lay{position:fixed;inset:0;z-index:60;background:#000;display:none;overflow:clip}
.lay.open{display:block;animation:fadeIn var(--t-slow) var(--ease) both}
.lay.closing{animation:layOut var(--t-slow) var(--ease) both}
@keyframes layOut{to{opacity:0;transform:scale(.985)}}
.mom.open{display:flex;align-items:center;justify-content:center;gap:22px}
.mbg{position:absolute;inset:-12%;filter:blur(48px) brightness(.4);pointer-events:none}
.mhd{position:absolute;left:28px;top:0;height:88px;display:flex;align-items:center;gap:14px;z-index:5;color:var(--ink-2);font:500 13px/1 var(--f-body)}
.phone{position:relative;height:min(86vh,800px);aspect-ratio:9/16;border-radius:28px;overflow:clip;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 40px 100px rgba(0,0,0,.7);background:#000;z-index:2}
.clips{position:absolute;inset:0;transition:transform var(--t-slow) var(--ease)}
.mclip{position:absolute;left:0;right:0;height:100%;overflow:hidden}
.mclip::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 28%),linear-gradient(0deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.2) 32%,transparent 52%)}
.mtop{position:absolute;left:18px;right:18px;top:18px;z-index:8}
.mtop .t{font:500 20px/1.15 var(--f-display);letter-spacing:-.015em;color:#fff}
.mnav{display:flex;flex-direction:column;align-items:center;gap:12px;z-index:2}
.mdots{display:flex;flex-direction:column;gap:6px}
.mpos{font:500 11px/1 var(--f-body);letter-spacing:.08em;color:var(--ink-2);white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg)}
.mnav .ibtn:disabled{opacity:.3;cursor:default}

.stage{position:fixed;inset:0;z-index:60;background:#000;display:none;overflow:clip;--chat-w:0px}
.stage.open{display:block}
.stage.chat-on{--chat-w:360px}
.st-main{position:absolute;top:0;bottom:0;left:0;right:var(--chat-w);transition:right var(--t-base) var(--ease)}
.st-video{position:absolute;inset:0;overflow:hidden;background:#000}
.pp-flash{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:12;pointer-events:none;opacity:0}
.pp-flash .ic{width:26px;height:26px}
.pp-flash.go{animation:ppFlash 700ms var(--ease) forwards}
@keyframes ppFlash{0%{opacity:1;transform:scale(.92)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.st-media{position:absolute;inset:0}
.st-media>.frame{transition:filter var(--t-slow) var(--ease)}
.stage.ended .st-media>.frame{filter:brightness(.55) blur(2px)}
.st-media.swap{animation:fadeIn var(--t-slow) var(--ease) both}
.st-dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity var(--t-base) var(--ease);pointer-events:none;z-index:8}
.stage.card-open .st-dim{opacity:.3;pointer-events:auto;cursor:pointer}
.st-shade{position:absolute;left:0;right:0;pointer-events:none;z-index:9;transition:opacity var(--t-base) var(--ease)}
.st-shade.t{top:0;height:170px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0))}
.st-shade.b{bottom:0;height:300px;background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.38) 50%,rgba(0,0,0,0))}
.st-top{position:absolute;top:0;left:0;right:0;height:88px;padding:0 28px;display:flex;align-items:center;gap:16px;z-index:20;transition:opacity var(--t-base) var(--ease)}
.st-title{display:flex;flex-direction:column;gap:4px;min-width:0}
.st-title b{font:500 17px/1.15 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-title span{font:400 13px/1.2 var(--f-body);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-meta{display:flex;align-items:center;gap:12px;margin-left:10px;flex:none}
.st-viewers{display:inline-flex;align-items:center;gap:7px;font:500 13px/1 var(--f-body);color:var(--ink-2)}
.st-viewers .ic{width:16px;height:16px}
.st-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.st-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 28px 22px;z-index:20;transition:opacity var(--t-base) var(--ease)}
.stage.idle{cursor:none}
.stage.idle .st-top,.stage.idle .st-bottom,.stage.idle .st-shade{opacity:0;pointer-events:none}
.stage.idle .st-shade.b{opacity:.5}
.tray-item{display:flex;align-items:center;gap:11px;height:54px;padding:6px 18px 6px 6px;border-radius:999px;background:rgba(16,16,20,.5);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);text-align:left;flex:none;animation:trayIn var(--t-slow) var(--ease) backwards;transition:background-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),transform var(--t-instant) var(--ease)}
.tray-item:hover{background:rgba(36,36,42,.66);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.tray-item:active{transform:scale(.98)}
@keyframes trayIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tray-item .tt{display:block;white-space:nowrap}
.tray-item b{display:block;font:500 13.5px/1.15 var(--f-body)}
.tray-item small{display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--f-body);color:var(--ink-2);margin-top:3px}
.st-ctrl{display:flex;align-items:center;gap:10px}
.cbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;transition:background-color var(--t-fast) var(--ease),transform var(--t-instant) var(--ease)}
.cbtn:hover{background:rgba(255,255,255,.08)}
.cbtn:active{transform:scale(.92)}
.cbtn .ic{width:22px;height:22px}
.st-time{font:500 13px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:92px;white-space:nowrap;margin:0 6px}
.st-prog{position:relative;flex:1;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.st-bar{position:relative;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.2);transition:height var(--t-fast) var(--ease)}
.st-prog:hover .st-bar,.st-prog.drag .st-bar{height:6px}
.st-buf{position:absolute;top:0;bottom:0;left:0;width:100%;background:rgba(255,255,255,.24);border-radius:inherit;transform-origin:0 50%;transform:scaleX(0)}
.st-fill{position:absolute;top:0;bottom:0;left:0;width:100%;background:#fff;border-radius:inherit;transform-origin:0 50%;transform:scaleX(0)}
.st-knob{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform var(--t-fast) var(--ease);box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:3}
.st-prog:hover .st-knob,.st-prog.drag .st-knob{transform:translate(-50%,-50%) scale(1)}
.mk{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;display:grid;place-items:center;z-index:4}
.mk::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 2px rgba(0,0,0,.7),0 0 8px var(--violet-glow);transition:background-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.mk:hover::before{background:var(--violet-hi);box-shadow:0 0 0 2px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.35)}
.mk-tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,4px);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;white-space:nowrap;background:rgba(16,16,20,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.mk:hover .mk-tip{opacity:1;transform:translate(-50%,0)}
.mk-tip .ti-media{width:32px;height:32px}
.mk-tip b{display:block;font:500 12.5px/1.1 var(--f-body);text-align:left}
.mk-tip span{display:block;font:500 11.5px/1.1 var(--f-body);color:var(--ink-2);margin-top:3px;text-align:left}
#stMarks{position:absolute;left:0;right:0;top:50%;height:0}
.mk-t{display:block}
.stage.chrome-hidden .st-top,.stage.chrome-hidden .st-bottom,.stage.chrome-hidden .st-dots{opacity:0}
.golive{display:none;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;font:500 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);white-space:nowrap;transition:background-color var(--t-fast) var(--ease)}
.golive:hover{background:rgba(255,255,255,.1)}
.golive.show{display:inline-flex}
.st-side{position:absolute;right:28px;bottom:156px;z-index:22;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px;transition:opacity var(--t-base) var(--ease)}
.st-side.dock{bottom:auto;transition:opacity var(--t-base) var(--ease),top var(--t-slow) var(--ease)}
.st-side.dock .st-dots{flex-direction:row;align-items:flex-start}
.st-side.dock .cd-tip{right:auto;left:50%;top:calc(100% + 10px);transform:translate(-50%,-4px)}
.st-side.dock .cdot:hover .cd-tip{transform:translate(-50%,0)}
.st-side.dock.dock-left .st-dots{flex-direction:column;align-items:flex-end}
.st-side.dock.dock-left .cd-tip{left:auto;right:calc(100% + 12px);top:50%;transform:translate(6px,-50%)}
.st-side.dock.dock-left .cdot:hover .cd-tip{transform:translate(0,-50%)}
.st-dots{display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px;transition:opacity var(--t-base) var(--ease)}
.st-dots:empty{display:none}
.cdot{position:relative;width:46px;height:46px;border-radius:50%;padding:0;background:rgba(16,16,20,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 10px 30px rgba(0,0,0,.45);transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-slow) var(--ease);animation:dotIn var(--t-slow) var(--ease) backwards}
@keyframes dotIn{from{opacity:0;transform:translateX(16px) scale(.6)}to{opacity:1;transform:none}}
.cdot:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 12px 34px rgba(0,0,0,.5)}
.cdot:active{transform:scale(.95)}
.cdot.ghosted{opacity:0;pointer-events:none;animation:none}
.cdot.landed{animation:none}
.cdot .cd-media{position:absolute;inset:4px;border-radius:50%;overflow:hidden;transition:opacity var(--t-base) var(--ease)}
.cdot::after{content:"";position:absolute;top:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 2px #000,0 0 8px var(--violet-glow);animation:breathe 1.6s ease-in-out infinite}
.cdot .cd-check{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:0;transform:scale(.6);transition:opacity var(--t-base) var(--ease),transform var(--t-slow) var(--ease)}
.cdot .cd-check .ic{width:20px;height:20px;stroke-width:2.4}
.cdot.sec{background:var(--violet);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(255,255,255,.2),0 12px 34px rgba(0,0,0,.5)}
.cdot.sec .cd-media{opacity:0}
.cdot.sec .cd-check{opacity:1;transform:none}
.cdot.sec::after{display:none}
.cdot.flash::before{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9);animation:ripple var(--t-cine) var(--ease) both}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.cd-tip{position:absolute;right:calc(100% + 12px);top:50%;transform:translate(6px,-50%);display:flex;flex-direction:column;gap:3px;padding:8px 13px 9px;border-radius:12px;white-space:nowrap;text-align:left;background:rgba(14,14,18,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.cd-tip b{font:500 13px/1.1 var(--f-body)}
.cd-tip span{font:400 11.5px/1.1 var(--f-body);color:var(--ink-2)}
.cdot:hover .cd-tip{opacity:1;transform:translate(0,-50%)}

.capsule{position:absolute;left:calc(var(--x,72) * 1%);top:calc(var(--y,56) * 1%);width:150px;z-index:21;cursor:pointer;opacity:0;pointer-events:none;transform:translate(-50%,-50%) translateY(16px) scale(.88);transition:opacity var(--t-slow) var(--ease),transform var(--t-cine) var(--ease)}
.capsule.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.capsule.off{transition:none}
.capsule.mcap{left:auto;top:auto;right:16px;bottom:20px;width:112px;transform:translateY(16px) scale(.88);transform-origin:100% 100%}
.capsule.mcap.show{transform:none}
/* Moments tiles (home and Capsule pages): the clip plays in place and opens the viewer; the capsule appears in the viewer only. */
.mom-media{position:relative}
.mom-open{display:block;width:100%}
.st-side .capsule{left:auto;top:auto;right:0;bottom:calc(100% + 14px);transform:translateY(16px) scale(.88);transform-origin:100% 100%}
.st-side .capsule.show{transform:none}
.st-side.dock .capsule{bottom:auto;top:calc(100% + 14px);width:112px;transform-origin:100% 0}
.st-side.dock .capsule .cap-body{width:112px;height:156px}
.st-side .cap-label{position:relative;left:100%;transform:translateX(-100%);width:max-content;max-width:280px;text-align:right;overflow:hidden;text-overflow:ellipsis}
.pin{position:absolute;left:calc(var(--x,50) * 1%);top:calc(var(--y,50) * 1%);width:18px;height:18px;margin:-9px 0 0 -9px;padding:0;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.28),0 3px 12px rgba(0,0,0,.55);z-index:21;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity var(--t-base) var(--ease),transform var(--t-slow) var(--ease)}
.pin.show{opacity:1;transform:none;pointer-events:auto}
.pin.off{transition:none}
.pin::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--violet-hi,#9b7bff);box-shadow:0 0 14px var(--violet-glow);animation:pinPulse 1.8s ease-out infinite;pointer-events:none}
.pin::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.pin:hover{transform:scale(1.15)}
@keyframes pinPulse{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.cap-body{position:relative;display:block;width:150px;height:210px;padding:0;border-radius:999px;background:rgba(10,10,12,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);filter:drop-shadow(0 26px 30px rgba(0,0,0,.55));transition:transform var(--t-instant) var(--ease)}
.cap-body:active{transform:scale(.98)}
.cap-body.has-render{background:transparent;box-shadow:none}
.mcap .cap-body{width:112px;height:156px}
.cap-in{position:absolute;inset:0;display:block;pointer-events:none}
.cap-shell{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity var(--t-base) var(--ease)}
.cap-body.has-render .cap-shell{opacity:1}
.cap-prod{position:absolute;inset:0;display:block;clip-path:inset(10% 14% 10% 14% round 999px);pointer-events:none}
.cap-prodimg{position:absolute;left:50%;top:52%;width:62%;height:68%;object-fit:contain;transform:translate(-50%,-50%)}
.cap-prod.is-thumb .cap-prodimg{width:54%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:50%}
.cap-prod.is-thumb::after{content:"";position:absolute;left:50%;top:52%;width:54%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 100%);box-shadow:inset 0 0 14px 2px rgba(0,0,0,.5)}
.cap-body.has-render .cap-shell.cap-gloss{mix-blend-mode:screen;opacity:.85}
.cap-gloss{mix-blend-mode:screen;opacity:.85;pointer-events:none}
.capsule.show .cap-body{animation:capIn 900ms var(--ease) backwards}
@keyframes capIn{from{transform:scale(.9)}to{transform:scale(1)}}
.capsule.show .cap-in{animation:capFloat 5s ease-in-out infinite}
@keyframes capFloat{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.cap-label{margin-top:10px;text-align:center;font:400 13px/1.3 var(--f-body);color:var(--ink-2);white-space:nowrap}
.capsule.sec .cap-label{color:var(--ink)}
.mcap .cap-label{position:relative;left:100%;transform:translateX(-100%);width:max-content;text-align:right;font-size:12px}
.morph{position:fixed;z-index:300;overflow:hidden;pointer-events:none;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.morph.float{box-shadow:none;overflow:visible}
.morph.cap{box-shadow:none;background:rgba(10,10,12,.3)}
.morph .band{position:absolute;inset:0;height:auto;border-radius:inherit}
.morph .cap-in{pointer-events:none}

.st-chat{position:absolute;top:0;right:0;bottom:0;width:360px;z-index:25;display:flex;flex-direction:column;background:#08080a;box-shadow:inset 1px 0 0 rgba(255,255,255,.06);transform:translateX(100%);transition:transform var(--t-base) var(--ease)}
.stage.chat-on .st-chat{transform:none}
.chat-head{height:88px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 22px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.chat-head b{font:500 16px/1 var(--f-display)}
.chat-head span{font:500 13px/1 var(--f-body);color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.chat-head .ibtn{margin-left:auto}
.chat-list{flex:1;overflow-y:auto;padding:18px 22px 12px;display:flex;flex-direction:column;gap:13px;scrollbar-width:none;-webkit-mask:linear-gradient(180deg,rgba(0,0,0,0),#000 60px);mask:linear-gradient(180deg,rgba(0,0,0,0),#000 60px)}
.chat-list::-webkit-scrollbar{display:none}
.msg{font:400 14px/1.45 var(--f-body);color:var(--ink);animation:msgIn var(--t-base) var(--ease) both;overflow-wrap:anywhere}
.msg .who{font-weight:500;color:var(--ink-3);margin-right:7px}
.msg.me .who{color:#fff}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-cap{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;border-radius:14px;text-align:left;box-shadow:inset 0 0 0 1px rgba(140,100,255,.38);animation:msgIn var(--t-base) var(--ease) both;transition:background-color var(--t-fast) var(--ease)}
.msg-cap:hover{background:rgba(109,59,230,.1)}
.msg-cap .ti-media{width:38px;height:38px}
.msg-cap .mc-t{display:block;min-width:0}
.msg-cap b{display:block;font:500 13px/1.2 var(--f-body)}
.msg-cap small{display:block;font:500 12px/1.2 var(--f-body);color:var(--ink-2);margin-top:2px}
.msg-cap .ic{margin-left:auto;width:16px;height:16px;color:var(--ink-2)}
.chat-form{flex:none;display:flex;align-items:center;gap:8px;margin:12px 16px 18px;height:46px;padding:0 6px 0 18px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.chat-form:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.chat-form input{flex:1;min-width:0;background:none;border:0;outline:0;font:400 14px/1 var(--f-body)}
.chat-form input::placeholder{color:var(--ink-3)}

.cardp{position:fixed;top:calc(var(--top) + 16px);right:24px;width:320px;z-index:120;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;color:var(--ink);background:var(--sheen),rgba(20,20,24,.42);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);box-shadow:var(--panel-shadow);opacity:0;visibility:hidden;transform:translateY(14px) scale(.96);transform-origin:100% 0;pointer-events:none;transition:opacity var(--t-slow) var(--ease),transform var(--t-slow) var(--ease),visibility 0s linear var(--t-slow)}
.cardp::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.10));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.cardp.open{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity var(--t-cine) var(--ease),transform var(--t-cine) var(--ease),top var(--t-slow) var(--ease),visibility 0s}
.cardp.host-stage{top:100px;right:28px}
.cardp.host-mom{top:50%;translate:0 -50%;right:auto;left:var(--mx,calc(50% + 300px))}
.cardp.swap>*{animation:rise var(--t-base) var(--ease) both}
.sc-head{display:flex;align-items:center;gap:8px;height:26px;flex:none}
.sc-brand{font:500 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.sc-flag{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:400 12px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}

function renderSidebar() {
  $('#logoSlot').innerHTML = MEDIA.logo && MEDIA.mark ? `<img class="logo-full" src="${esc(MEDIA.logo)}" alt="Axiaor"><img class="logo-mk" src="${esc(MEDIA.mark)}" alt="">` : LOGO_FULL_SVG + LOGO_MK_SVG;
  $('#sbNav').innerHTML = '<span class="sb-ind" id="sbInd"></span>' + NAV.map(([k, l, icon]) => {
    const extra = k === 'live' ? `<span class="sb-badge live lbl"><span class="dot"></span>${liveCount()}</span>` : '';
    const on = NAV_ON.has(icon);
    return `<button class="sb-item${on ? ' has-on' : ''}" data-act="nav" data-k="${esc(k)}" data-tip="${esc(l)}">${ic(icon, 'ic-off')}${on ? ic(icon + '-on', 'ic-on') : ''}<span class="lbl">${esc(l)}</span>${extra}</button>`;
  }).join('');
  $('#sbFoot').innerHTML = `<div class="sb-item sb-label" data-tip="Ask Capsule">${ic('sparkle')}<span class="lbl">Ask Capsule</span></div>` + '<div class="me"><span class="avatar">K</span><span class="who lbl"><b>Kai</b><small>Premium member</small></span></div>';
  markNav(null, false); /* re-apply the active item (and its filled icon) after any re-render */
}
let navK = 'home';
function markNav(k, animate = true) {
  if (k) navK = k;
  let on = null;
  $$('.sb-item').forEach(b => { const m = b.dataset.k === navK; b.classList.toggle('on', m); if (m) on = b; });
  const ind = $('#sbInd');
  if (!ind || !on) return;
  if (!animate) ind.style.transition = 'none';
  ind.style.opacity = '1';
  ind.style.transform = `translateY(${on.offsetTop}px)`;
  if (!animate) { void ind.offsetWidth; ind.style.transition = ''; }
}
function nav(k) {
  closePop();
  if (k === 'home') { goHome(); return; }
  spyLock = Date.now() + 900;
  markNav(k);
  const r = $(`.row[data-row="${k}"]`);
  if (r) scrollTo({ top: r.getBoundingClientRect().top + scrollY - 92, behavior: 'smooth' });
}
function toggleSidebar(force) {
  state.collapsed = typeof force === 'boolean' ? force : !state.collapsed;
  document.body.classList.toggle('sb-collapsed', state.collapsed);
  $('.sb-toggle').setAttribute('aria-label', state.collapsed ? 'Expand sidebar' : 'Collapse sidebar');
  hideTip();
  setTimeout(() => markNav(null, false), 280);
}
function hideTip() { $('#tip').classList.remove('on'); }
function showTip(e) {
  const t = e.target.closest('[data-tip]');
  if (!t || !state.collapsed) { hideTip(); return; }
  const r = t.getBoundingClientRect(), tip = $('#tip');
  tip.textContent = t.dataset.tip;
  tip.style.left = (r.right + 14) + 'px';
  tip.style.top = (r.top + r.height / 2 - 14) + 'px';
  tip.classList.add('on');
}
const greeting = () => { const h = new Date().getHours(); return (h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 18 ? 'Good afternoon' : 'Good evening') + ', Kai'; };

/* Toasts, reminders, notes, Pop */
function toast(html, icon = 'check', ok = false) {
  const host = Stage.isOpen ? $('#stToasts') : $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (ok ? ' ok' : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="tic">${ic(icon)}</span><span>${html}</span>`;
  host.appendChild(el);
  while (host.children.length > 2) host.firstElementChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, ok ? 5200 : 2800);
}
function remind(k) {
  const it = ITEMS[k];
  if (!it || isLive(k)) return;
  if (state.reminders.has(k)) { state.reminders.delete(k); clearTimeout(state.timers[k]); }
  else { state.reminders.add(k); toast(`<b>Reminder set</b> · ${esc(it.title)} · ${esc(whenOf(k))}`, 'bell'); state.timers[k] = setTimeout(() => kickoff(k), 6000); }
  $$(`[data-act="remind"][data-s="${k}"]`).forEach(b => { if (b.closest('.pop')) return; const tmp = document.createElement('div'); tmp.innerHTML = remindBtn(k, b.dataset.cls || ''); b.replaceWith(tmp.firstElementChild); });
  Profile.refresh(k);
  updateBadges();
  if (Pop.name) renderPop();
}
function kickoff(k) {
  const it = ITEMS[k];
  state.reminders.delete(k);
  clearTimeout(state.timers[k]);
  if (!it || state.kicked.has(k)) return;
  state.kicked.add(k);
  it.viewers = it.viewers || 4000 + Math.floor(Math.random() * 3000);

  updateBadges();

  if (!Stage.isOpen && !Mom.isOpen) notify(k);
}
function refreshLive(k) {

  if (badge) badge.innerHTML = `<span class="dot"></span>${liveCount()}`;

}
function notify(k) {

  $('#notes').prepend(el);
  markReady(el);
  el._t = setTimeout(() => dismissNote(el), 18000);
}
function dismissNote(el) {

}
function updateBadges() {

const Pop = { name: null };
function popHTML(name) {

  }
  const list = state.orders;

}

    $('#stUp').innerHTML = `<div class="up-l">${kick}<h2 class="up-t">${esc(nx.title)}</h2><p class="up-m">${esc(meta)}</p><div class="up-actions"><button class="btn btn-violet" data-act="up-play">${ic('play')}${live ? 'Join live' : 'Watch next'}</button>${replay}${back}</div>${recapBlock}</div><div class="up-r"><button class="up-media" data-act="up-play" aria-label="Watch ${esc(nx.title)}">${frameHTML(nx.media, { lazy: false })}<span class="play">${ic('play')}</span></button></div>`;

  replay() { this.ended = false; this.el.classList.remove('ended'); this.seek(0); this.playing = true; this.setPlayIcon(); this.syncVideo(); },
  seek(nt) {

  setPlayIcon() { const b = $('#stPlay'); b.innerHTML = ic(this.playing ? 'pause' : 'play'); b.setAttribute('aria-label', this.playing ? 'Pause' : 'Play'); },
  setMuteIcon() { const b = $('#stMute'); b.innerHTML = ic(this.muted ? 'mute' : 'volume'); b.setAttribute('aria-label', this.muted ? 'Unmute' : 'Mute'); },

    b.dataset.act = 'cap-open';
    b.dataset.i = c.i;
    b.innerHTML = `<span class="ti-media">${pmHTML(c.p)}</span><span class="mc-t"><b>${esc(p.name)} is in frame</b><small class="num">${money(p.price)} · ${esc(p.brand)}</small></span>${ic('right')}`;

  key(e, typing) {
    if (Card.securing && e.key === 'Escape') { e.preventDefault(); return; }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (typing) { document.activeElement.blur(); return; }
      if (Card.open) Card.close();
      else this.close();
      return;
    }
    if (typing) return;
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); this.togglePlay(); }
    else if (e.key === 'ArrowRight') this.seek(this.t + 5);
    else if (e.key === 'ArrowLeft') this.seek(this.t - 5);
    else if (e.key === 'm' || e.key === 'M') this.handle('mute');
    this.wake();
  },
  handle(a, t) {
    switch (a) {
      case 'stage-close': this.close(); break;
      case 'play': this.togglePlay(); break;
      case 'mute': this.muted = !this.muted; this.setMuteIcon(); this.syncVideo(); break;
      case 'chat-toggle': this.chatWas = false; this.setChat(!this.chatOn); break;
      case 'cap-open': { const c = this.caps[+t.dataset.i]; if (c) Card.show(c.p, { host: 'stage', cap: c, srcEl: t }); break; }
