      case 'up-play': if (this.it.next && canEnter(this.it.next)) this.open(this.it.next); break;
      case 'replay': this.replay(); break;
    }
  }
};

/* Moments (vertical viewer). Each clip plays its own file; a poster-only moment shows the poster. */
const Mom = {
  isOpen: false, list: [], order: [], i: 0, wheelT: 0, MAX: 5, trimT: 0,
  open(list, start) {
    if (!list.length) return;
    closePop();
    Card.close(true);
    if (Pick.isOpen) Pick.close(true);
    this.list = list;
    const n = list.length, first = ((start % n) + n) % n;
    this.order = n > 1 ? [first, (first + 1) % n] : [first];
    $('#momClips').innerHTML = this.order.map((idx, j) => this.clipHTML(idx, j)).join('');
    const el = $('#mom');
    el.classList.remove('closing');
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    document.documentElement.classList.add('lock');
    this.isOpen = true;
    this.i = 0;
    this.set(0, true);
    MomTiles.sync();
  },
  pidOf(m) { const p = m.caps && m.caps[0] && m.caps[0].p; return p && P[p] ? p : ''; },
  clipHTML(idx, j) {
    const m = this.list[idx], pid = this.pidOf(m);
    return `<div class="mclip" data-idx="${idx}" style="top:${j * 100}%">${frameHTML(m.media, { video: true, loop: true, preload: 'auto', lazy: false })}<div class="mtop"><div class="t">${esc(m.caption || '')}</div></div>${pid ? this.capsule(pid) : ''}</div>`;
  },
  capsule(pid) {
    const p = P[pid], s = isSec(pid);
    return `<div class="capsule mcap${s ? ' sec' : ''}" data-pid="${pid}"><button class="cap-body" data-act="piece" data-pid="${pid}" aria-label="${esc(p.name)}, ${s ? 'secured' : money(p.price)}">${capBodyHTML(pid)}</button><div class="cap-label">${esc(capLabel(pid))}</div></div>`;
  },
  place(instant) {
    const clips = $('#momClips');
    $$('.mclip', clips).forEach((c, k) => { c.style.top = (k * 100) + '%'; });
    if (instant) clips.style.transition = 'none';
    clips.style.transform = `translateY(-${this.i * 100}%)`;
    if (instant) { void clips.offsetWidth; clips.style.transition = ''; }
  },
  set(i, instant) {
    const n = this.list.length, clips = $('#momClips');
    if (n > 1) {
      if (i <= 0) {
        const prev = (this.order[0] - 1 + n) % n;
        this.order.unshift(prev);
        clips.insertAdjacentHTML('afterbegin', this.clipHTML(prev, 0));
        this.i += 1;
        i += 1;
        this.place(true);
      }
      if (i >= this.order.length - 1) {
        const next = (this.order[this.order.length - 1] + 1) % n;
        this.order.push(next);
        clips.insertAdjacentHTML('beforeend', this.clipHTML(next, this.order.length - 1));
      }
    }
    this.i = i;
    this.place(instant);
    const idx = this.order[i], m = this.list[idx];
    $$('.mclip', clips).forEach((c, k) => { c.classList.toggle('cur', k === i); const cap = $('.mcap', c); if (cap) cap.classList.toggle('show', k === i); });
    $('#momBg').innerHTML = frameHTML(m.media, { lazy: false });
    markReady($('#mom'));
    $('#momDots').innerHTML = `<span class="mpos num">${idx + 1} / ${n}</span>`;
    this.playCur();
    clearTimeout(this.trimT);
    this.trimT = setTimeout(() => this.trim(), instant ? 0 : 450);
  },
  playCur() {
    $$('#momClips .mclip').forEach((c, k) => {
      const v = $('video.media', c);
      if (!v) return;
      if (k === this.i) { v.muted = false; const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); }); }
      else if (!v.paused) v.pause();
    });
  },
  trim() {
    if (!this.isOpen) return;
    const clips = $('#momClips');
    while (this.order.length > this.MAX) {
      if (this.i > (this.order.length - 1) / 2) { this.order.shift(); clips.firstElementChild.remove(); this.i -= 1; }
      else { this.order.pop(); clips.lastElementChild.remove(); }
    }
    this.place(true);
  },
  go(d) { const n = this.i + d; if (n < 0 || n >= this.order.length) return; Card.close(true); this.set(n); },
  close(instant) {
    if (!this.isOpen) return;
    Card.close(true);
    this.isOpen = false;
    $$('#momClips video').forEach(v => v.pause());
    const el = $('#mom');
    const done = () => { el.classList.remove('open', 'closing'); el.setAttribute('aria-hidden', 'true'); $('#momClips').innerHTML = ''; $('#momBg').innerHTML = ''; };
    if (instant || reduced()) done(); else { el.classList.add('closing'); setTimeout(done, 400); }
    if (!Stage.isOpen && !Pick.isOpen && !Profile.isOpen) document.documentElement.classList.remove('lock');
    MomTiles.sync();
  }
};

/* Moments tiles play in place: muted, looping, poster until ready, and only while on screen —
   paused when the tab is hidden, under the Stage or the viewer, or when their page is covered. */
const MomTiles = {
  io: null, vids: new Set(),
  covered(v) {
    if (Stage.isOpen || Mom.isOpen) return true;
    return !!v.closest('.pf') !== Profile.isOpen; /* Capsule-page tiles only while the page is open; home tiles only while it is not */
  },
  sync() {
    this.vids.forEach(v => {
      if (!v.isConnected) { if (this.io) this.io.unobserve(v); this.vids.delete(v); return; }
      if (v.dataset.vis === '1' && !document.hidden && !this.covered(v)) { if (v.paused) { v.muted = true; v.play().catch(() => {}); } }
      else if (!v.paused) v.pause();
    });
  },
  observe(root) {
    if (!this.io) this.io = new IntersectionObserver(es => { es.forEach(x => { x.target.dataset.vis = x.isIntersecting ? '1' : '0'; }); this.sync(); }, { threshold: .18 });
    $$('.mom-tile video.media', root || document).forEach(v => { if (!this.vids.has(v)) { this.vids.add(v); this.io.observe(v); } });
    this.sync();
  }
};

/* Category popup (Music videos / Brands / Creators). Lists tiles in place; a tile opens its Capsule page. */
const Pick = {
  isOpen: false, rowId: '', cat: '', closeT: 0,
  open(rowId, cat) {
    const row = rowById(rowId);
    if (!row) return;
    closePop();
    clearTimeout(this.closeT);
    this.rowId = rowId;
    this.cat = cat;
    $('#pkEyebrow').textContent = { music: 'Featured artists', brands: 'Featured brands', creators: 'Featured creators' }[rowId] || '';
    $('#pkTitle').textContent = cat;
    this.render();
    const el = $('#pk');
    el.classList.remove('closing');
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    document.documentElement.classList.add('lock');
    this.isOpen = true;
    $('#pkTrack').scrollLeft = 0;
  },
  tiles() {
    /* Brands: that category's brands as cine stills, each opening its Brand Capsule. Everything else: creator portraits
       from CONTENT.members, opening the Artist Capsule (Music videos) or the Creator Capsule (Creators). */
    if (this.rowId === 'brands') {
      return (CONTENT.brands[this.cat] || []).map((b, j) => `<button class="card card--cine pk-item" data-act="profile" data-kind="brand" data-key="${esc(b.name || '')}" style="--i:${j}" aria-label="${esc(b.name || '')}">${frameHTML(b.media || '')}<div class="card-line">${esc(b.name || '')}</div></button>`).join('');
    }
    const music = this.rowId === 'music';
    const people = (rowById('creators') || { cards: [] }).cards;
    const stills = (rowById('music') || { cards: [] }).cards.map(c => c.media);
    return (CONTENT.members[this.cat] || []).map((m, j) => {
      const c = people.find(x => x.media === m) || { media: m, caption: '', cat: '' };
      /* The template follows the row the popup was opened from: Music videos → Artist Capsule, Creators → Creator Capsule. */
      const kind = music ? 'artist' : 'creator';
      /* Music: wide tiles like Brands, showing the artist's featured music video (anyone without one rotates through the music stills). */
      const img = music ? ((PF.videos || {})[m] || stills[j % stills.length] || c.media) : c.media;
      return `<button class="card ${music ? 'card--cine' : 'card--round'} pk-item" data-act="profile" data-kind="${kind}" data-key="${esc(c.media)}" style="--i:${j}" aria-label="${esc(c.caption || '')}">${frameHTML(img)}<div class="card-line">${esc(c.caption || '')}</div></button>`;
    }).join('');
  },
  render() {
    const tr = $('#pkTrack');
    tr.innerHTML = this.tiles() || '<div class="pk-empty">Nothing tagged yet.</div>';
    markReady(tr);
  },
  refresh() { if (this.isOpen) this.render(); },
  close(instant) {
    if (!this.isOpen) return;
    this.isOpen = false;
    const el = $('#pk');
    const done = () => { el.classList.remove('open', 'closing'); el.setAttribute('aria-hidden', 'true'); $('#pkTrack').innerHTML = ''; };
    if (instant || reduced()) done(); else { el.classList.add('closing'); this.closeT = setTimeout(done, 260); }
    if (!Stage.isOpen && !Mom.isOpen && !Profile.isOpen) document.documentElement.classList.remove('lock');
  }
};

/* Keyword index over what is already on the page (cards, brands, creators, products). Used by Ask Capsule as its fallback. */
const Search = {
  index() {
    const out = [], seen = new Set();
    const add = (name, label, thumb, go) => { const k = (name + '|' + label).toLowerCase(); if (!name || seen.has(k)) return; seen.add(k); out.push({ name, label, thumb, go }); };
    ROWS.forEach(row => row.cards.forEach((c, i) => {
      if (!c.caption) return;
      const thumb = frameHTML(c.media || '');
      if (row.id === 'creators') {
        add(c.caption, 'Creators', thumb, () => Profile.open(c.cat === 'Artist' ? 'artist' : 'creator', c.media));
      } else if (row.id === 'moments') {
        add(c.caption, row.title, thumb, () => nav('moments'));
      } else {
        add(c.caption, row.title, thumb, from => { if (c.media && ITEMS[c.media] && canEnter(c.media)) Stage.open(c.media, { from }); else nav(row.id); });
      }
    }));
    Object.keys(CONTENT.brands || {}).forEach(cat => CONTENT.brands[cat].forEach(b => add(b.name, 'Brands', frameHTML(b.media || ''), from => openBrandStore(b.name, from))));
    Object.keys(P).forEach(pid => add(P[pid].name, 'Products', pmHTML(pid), () => Card.show(pid, { host: 'home', flag: 'Search result' })));
    return out;
  },
  match(q) {
    q = q.trim().toLowerCase();
    if (q.length < 2) return [];
    const all = this.index().filter(r => r.name.toLowerCase().includes(q));
    const rank = r => r.name.toLowerCase().startsWith(q) ? 0 : 1;
    return all.map((r, i) => [r, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]).slice(0, 6);
  }
};

/* Ask Capsule: the top-right field and its one dropdown. Curated answer card first, keyword rows as fallback. */
const TRY = ['New York Fashion Week', "What's live tonight?", 'The blue bag'];
const Ask = {
  isOpen: false, thinkT: 0, cur: null, rows: [],
  answer(q) {
    q = q.toLowerCase();
    const caps = id => plural((ITEMS[id] && ITEMS[id].caps.length) || 0, 'capsule') + ' in frame';
    if (/\b(fashion|runway|front row|new york)/.test(q)) return { media: 'hero', eyebrow: 'Fashion Week', title: CONTENT.hero.title, line: caps('hero'), btn: 'Play now', cls: 'btn-violet', go: from => Stage.open('hero', { from }) };
    if (/\b(live|tonight|stream|neon)/.test(q)) return { media: 'stage-1', eyebrow: 'Live now · Signature Stage', title: 'Neon live', line: fmtK(viewersOf('stage-1')) + ' watching', btn: 'Join live', cls: 'btn-violet', go: from => Stage.open('stage-1', { from }) };
    if (/\b(bag|blue|jacquemus|blazer)/.test(q)) return { media: 'ask-p9', eyebrow: 'Jacquemus', title: P.p9.name, line: money(P.p9.price) + ' · from Brands', btn: 'View capsule', cls: 'btn-outline', go: () => Card.show('p9', { host: 'home', flag: 'From Ask Capsule' }) };
    if (/\b(music|studio|r&b|jazz|sing)/.test(q)) return { media: 'music-4', eyebrow: 'Music videos', title: 'Six categories, Gospel to Jazz', line: 'Pick one to see its artists', btn: 'Browse', cls: 'btn-outline', go: () => nav('music') };
    return null;
  },
  tryHTML() { return `<div class="ip-try"><span class="lab">Try</span>${TRY.map(t => `<button class="btn btn-outline btn-xs" data-act="ask-try" data-q="${esc(t)}">${esc(t)}</button>`).join('')}</div>`; },
  cardHTML(a) {
    if (a.media === 'ask-p9') MEDIA['ask-p9'] = { img: MEDIA['thumb:p9'] };
    return `<div class="ia"><div class="ia-img">${frameHTML(a.media, { lazy: false })}</div><div class="ia-t"><span class="ia-e">${esc(a.eyebrow)}</span><span class="ia-n">${esc(a.title)}</span><span class="ia-l">${esc(a.line)}</span><button class="btn ${a.cls}" data-act="ask-go">${esc(a.btn)}</button></div></div>`;
  },
  show(html) { const pop = $('#askPop'); pop.innerHTML = html; markReady(pop); pop.classList.add('open'); this.isOpen = true; },
  resolve() {
    clearTimeout(this.thinkT); this.thinkT = 0;
    const q = $('#askIn').value.trim();
    this.cur = null; this.rows = [];
    if (!q) { this.show(this.tryHTML()); return; }
    const a = this.answer(q);
    if (a) { this.cur = a; this.show(this.cardHTML(a)); return; }
    this.rows = Search.match(q);
    if (this.rows.length) this.show(`<div class="ip-rows">${this.rows.map((r, i) => `<button class="ip-row" data-act="ask-row" data-i="${i}"><span class="ip-th">${r.thumb}</span><span class="ip-n">${esc(r.name)}</span><span class="ip-l">${esc(r.label)}</span></button>`).join('')}</div>`);
    else this.show(`<div class="ip-none">Nothing for that yet. Try "New York Fashion Week".</div>${this.tryHTML()}`);
  },
  input() {
    clearTimeout(this.thinkT);
    this.cur = null; this.rows = [];
    if (!$('#askIn').value.trim()) { this.thinkT = 0; this.show(this.tryHTML()); return; }
    this.show('<div class="ip-think">Capsule is looking across videos, moments and live</div>');
    this.thinkT = setTimeout(() => this.resolve(), 400);
  },
  go() {
    if (this.thinkT) this.resolve();
    if (this.cur) { const a = this.cur, from = $('#askPop .ia-img'); this.close(true); a.go(from); }
    else if (this.rows.length) this.pick(0);
  },
  pick(i) {
    const r = this.rows[i];
    if (!r) return;
    const th = $(`#askPop .ip-row[data-i="${i}"] .ip-th`);
    this.close(true);
    r.go(th || $('#search'));
  },
  close(clear) {
    clearTimeout(this.thinkT); this.thinkT = 0;
    const pop = $('#askPop');
    pop.classList.remove('open'); pop.innerHTML = '';
    this.isOpen = false; this.cur = null; this.rows = [];
    if (clear) { $('#askIn').value = ''; $('#askIn').blur(); }
  },
  init() {
    const inp = $('#askIn');
    inp.addEventListener('focus', () => { if (!inp.value.trim()) this.show(this.tryHTML()); else if (!this.isOpen) this.resolve(); });
    inp.addEventListener('input', () => this.input());
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this.go(); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.close(false); inp.blur(); }
    });
    document.addEventListener('pointerdown', e => { if (this.isOpen && !e.target.closest('#search')) this.close(false); });
  }
};

   kinds, the product card, the Stage, the Moments viewer). A section with no data is not rendered. */
const PF = CONTENT.profiles || {};
/* Invented partner brands, their marks drawn in code: 24×24, white 1.6 stroke, round joins. */
const PARTNER_LOGOS = {

const Profile = {
  isOpen: false, kind: '', key: '', data: null, secs: [], tiles: {}, liveList: null, liveDays: null, liveDay: '', liveSel: '', nowPlaying: null, spyLock: 0, closeT: 0, tabsTop: 0, follow: new Set(),
  people() { return (rowById('creators') || { cards: [] }).cards; },
  person(m) { return this.people().find(c => c.media === m) || { media: m, caption: '', cat: '' }; },
  cards(rowId) { const r = rowById(rowId); return r ? r.cards : []; },
  cardOf(ref) {
    const id = typeof ref === 'string' ? ref : ref.media;
    let found = null;
    ROWS.forEach(r => r.cards.forEach(c => { if (!found && c.media === id) found = c; }));
    if (!found && id === 'hero') found = { media: 'hero', caption: CONTENT.hero.title };
    return found ? (typeof ref === 'string' ? found : Object.assign({}, found, ref)) : null;
  },
  fill(s, d) { return String(s).replace(/\{name\}/g, d.name).replace(/\{cat\}/g, d.cat || ''); },
  /* Live dates are registered as upcoming items so the existing Remind me flow (set → 6s → live → Join live) works unchanged.
     caps: { p, t, x, y } pins on the date's own clip, as on the home items (a bare pid still works and takes the default pin). */
  events(list, d, prefix) {
    return (list || []).map((ev, i) => {
      const id = `${prefix}-${i + 1}`, title = this.fill(ev.title, d);
      if (!ITEMS[id]) addItem(id, { title, sub: d.name, media: ev.media, upcoming: ev.when, dur: 72, caps: (ev.caps || []).map(c => typeof c === 'string' ? { p: c } : Object.assign({}, c)), about: this.fill(ev.about || '', d) });
      return { media: id, still: ev.media, caption: title, venue: ev.venue || '', city: ev.city || '', about: this.fill(ev.about || '', d) };
    });
  },

  /* ---- data builders ---- */
  build(kind, key) {
    if (kind === 'brand') return this.brand(key);
    if (kind === 'artist') return this.artist(key);
    if (kind === 'creator') return this.creator(key);
    return null;
  },
  brand(name) {
    let cat = '', tile = '';
    Object.keys(CONTENT.brands || {}).forEach(k => (CONTENT.brands[k] || []).forEach(b => { if (b.name === name) { cat = k; tile = b.media || ''; } }));
    if (!cat && !(PF.brands || {})[name]) return null;
    const o = (PF.brands || {})[name] || {};
    const slug = slugOf(name), mslug = 'brand';   /* slug: event ids · mslug: the shared brand media set */
    const hero = o.hero || tile;
    const films = (o.films || []).map(r => this.cardOf(r)).filter(Boolean).concat(this.cards('films'));
    const people = o.people || ((CONTENT.members || {})[(PF.ambassadors || {})[cat]] || []).concat(PF.guests || []);
    const d = { kind: 'brand', name, label: 'Official Brand Capsule', hero: { media: hero, video: !!mediaOf(hero).video }, menu: PF.menu || [], moments: this.momentsOf('brand') };
    /* Live events: the home live row as it stands, plus two profile-only dates. */
    const homeLive = this.cards('live').map(c => ({ id: c.media, title: (ITEMS[c.media] || {}).title || c.caption || '', venue: ((PF.venues || {})[c.media] || [])[0] || '', city: ((PF.venues || {})[c.media] || [])[1] || '', about: c.about || '' }));
    const extras = this.events(PF.brandEvents, d, 'ev-' + slug).map(ev => ({ id: ev.media, title: ev.caption, venue: ev.venue, city: ev.city, about: ev.about }));
    d.secs = [
      this.liveSec(slug, homeLive.concat(extras)),
      this.sec('collections', 'Collections', `<div class="pf-cols"><div class="card card--col" style="--i:0">${frameHTML(pfKey(mslug, 'men'))}<div class="card-line">Men</div></div><div class="card card--col" style="--i:1">${frameHTML(pfKey(mslug, 'women'))}<div class="card-line">Women</div></div></div>`),
      /* The advert band is decoration, not a section: no heading, no tab, skipped by the scroll spy. */
      { id: 'band', tab: '', html: `<div class="pf-band"><div class="card card--ad" style="--i:0">${frameHTML(this.bandKey(mslug, 'brands-1'), { video: true, autoplay: true, muted: true, loop: true })}<div class="card-line">Spring 2026 campaign</div></div></div>` },
      this.rowSec('moments', 'Moments', d.moments.map((m, i) => this.momTile(m, i))),
      this.rowSec('people', 'People & Ambassadors', people.map((m, j) => this.personTile(mslug, m, j))),
      this.rowSec('experience', 'The Experience', this.expRow()),
      this.rowSec('films', 'Brand films', [this.tile({ media: 'brands-1', caption: 'Campaign film' }, 'film', 0)].concat(films.filter(c => c.media !== 'brands-1').map((c, j) => this.filmTile(mslug, c, j + 1))))
    ].filter(Boolean);

  },
  artist(media) {
    const c = this.person(media);
    if (!c.caption) return null;
    const g = (PF.generic || {}).artist || {}, o = Object.assign({}, g, (PF.artists || {})[media] || {});
    /* Hero: the artist's own portrait, blurred behind the portrait circle, so each page takes its backdrop from its own colours. */
    const d = { kind: 'artist', name: c.caption, cat: c.cat, portrait: media, label: 'Official Artist Capsule', hero: { media, video: false }, moments: this.momentsOf('artist') };
    this.ensureFeatured();
    d.firstSong = ((o.songs || [])[0] || {}).title || '';
    d.line = [o.audience, o.location].filter(Boolean).join(' · ');
    /* The two metrics that stay, as a facts row under the hero line; the rest of `metrics` is kept as data. */
    const facts = ['Followers', 'Top markets'].map(l => { const m = (o.metrics || []).find(x => x[0] === l); return m ? `<span class="pf-fact"><span class="k">${esc(m[0])}</span><b>${esc(m[1])}</b></span>` : ''; }).join('');
    d.facts = facts ? `<div class="pf-facts">${facts}</div>` : '';
    d.bio = this.fill(o.bio || '', d);
    /* Play opens the Stage with the featured music video; the Popular rows keep their own play state. */
    d.actions = `<button class="btn btn-violet" data-act="profile-play">${ic('play')}Play</button>${this.followBtn()}`;
    const slug = slugOf(d.name), mslug = 'artist';   /* slug: event and item ids · mslug: the shared artist media set */
    const evs = this.events(o.events, d, 'ev-' + media).map(ev => ({ id: ev.media, title: ev.caption, venue: ev.venue, city: ev.city, about: ev.about }));
    d.secs = [
      this.sec('popular', 'Popular', this.songs(o.songs || [], mslug)),
      this.liveSec(slug, evs),
      this.rowSec('videos', 'Music videos', (o.songs || []).map((song, j) => this.mvTile(mslug, slug, song, j))),
      this.rowSec('partners', 'Brand Partnerships', (o.partners || []).map((pt, j) => this.ptnTile(mslug, pt, j, media))),
      /* The decorative band, as on the Brand and Creator pages: no heading, no tab, skipped by the scroll spy. */
      { id: 'band', tab: '', html: `<div class="pf-band"><div class="card card--ad" style="--i:0">${frameHTML(this.bandKey(mslug, 'experience-3'), { video: true, autoplay: true, muted: true, loop: true })}<div class="card-line">Tour film · 2026</div></div></div>` },
      this.rowSec('moments', 'Moments', d.moments.map((m, i) => this.momTile(m, i))),
      this.rowSec('experience', 'The Experience', this.expRow())
    ].filter(Boolean);
    return d;
  },
  creator(media) {
    const c = this.person(media);
    if (!c.caption) return null;
    const g = (PF.generic || {}).creator || {}, o = Object.assign({}, g, (PF.creators || {})[media] || {});
    const d = { kind: 'creator', name: c.caption, cat: c.cat, portrait: media, label: 'Official Creator Capsule', hero: { media, video: false }, moments: this.momentsOf('creator') };
    d.line = this.fill(o.focus || '', d);
    d.actions = this.followBtn();
    const slug = slugOf(d.name), mslug = 'creator';   /* slug: event ids · mslug: the shared creator media set */
    const evs = this.events(o.events, d, 'ev-' + media).map(ev => ({ id: ev.media, title: ev.caption, venue: ev.venue, city: ev.city, about: ev.about }));
    d.secs = [
      this.liveSec(slug, evs),
      this.rowSec('partners', 'Brand Partnerships', (o.partners || []).map((pt, j) => this.ptnTile(mslug, pt, j, media))),
      /* The decorative band, as on the Brand page: no heading, no tab, skipped by the scroll spy. */
      { id: 'band', tab: '', html: `<div class="pf-band"><div class="card card--ad" style="--i:0">${frameHTML(this.bandKey(mslug, 'films-1'), { video: true, autoplay: true, muted: true, loop: true })}<div class="card-line">Spring 2026 campaign</div></div></div>` },
      this.rowSec('moments', 'Moments', d.moments.map((m, i) => this.momTile(m, i))),
      this.rowSec('experience', 'The Experience', this.expRow())
    ].filter(Boolean);
    return d;
  },

  /* ---- section and tile builders (each returns '' / null when there is nothing to show) ---- */
  sec(id, title, body, tab, headExtra) { return body ? { id, tab: tab || title, html: `<section class="row pf-sec" id="pf-${id}" data-sec="${id}"><header class="row-head"><h2>${esc(title)}</h2>${headExtra || ''}</header>${body}</section>` } : null; },
  rowSec(id, title, tiles, headExtra) { return tiles.length ? this.sec(id, title, `<div class="row-track">${tiles.join('')}</div>`, '', headExtra) : null; },
  /* Live events (all three pages): a 16/9 stage showing the selected event — default the one live now,
     else the nearest upcoming — with its facts and capsule pills, beside an Upcoming panel: a snapping day
     wheel and the selected day's rows. Clicking a row stages that event (pickLive swaps the left column). */
  liveSec(slug, list) {
    list = (list || []).filter(ev => ITEMS[ev.id]);
    if (!list.length) return null;
    this.liveList = { slug, list };
    const dayOf = ev => { const dt = dateOfWhen(ITEMS[ev.id].upcoming); return dt || (isLive(ev.id) ? new Date() : null); };
    const groups = new Map();
    list.forEach(ev => { const dt = dayOf(ev); if (!dt) return; const k = dt.toDateString(); if (!groups.has(k)) groups.set(k, { date: dt, evs: [] }); groups.get(k).evs.push(ev); });
    const days = [...groups.entries()].sort((a, b) => a[1].date - b[1].date);
    this.liveDays = new Map(days);
    const liveEv = list.find(ev => isLive(ev.id));
    if (!this.liveDay || !groups.has(this.liveDay)) this.liveDay = liveEv ? (dayOf(liveEv) || new Date()).toDateString() : (days[0] ? days[0][0] : '');
    const key = ev => { const dt = dateOfWhen(ITEMS[ev.id].upcoming); return (dt ? dt.getTime() : 9e15) + minsOf(timeOfWhen(ITEMS[ev.id].upcoming)) * 6e4; };
    const def = liveEv || list.slice().sort((a, b) => key(a) - key(b))[0];
    const staged = list.find(ev => ev.id === this.liveSel) || def;
    this.liveSel = staged.id;
    const wheel = `<div class="pfl-wheel" id="pflWheel" aria-label="Pick a day">${days.map(([k, g]) => `<button class="pfl-cell" type="button" data-act="pfl-day" data-d="${esc(k)}"><span class="d">${esc(DAYS[g.date.getDay()])}</span><span class="n num">${g.date.getDate()}</span></button>`).join('')}</div>`;
    const panel = `<div class="pfl-panel" style="--i:3"><div class="pfl-pin"><span class="eyebrow">Upcoming</span><div class="pfl-cols">${wheel}<div class="pfl-daylist" id="pflDay">${this.dayRows((groups.get(this.liveDay) || { evs: [] }).evs)}</div></div></div></div>`;
    return this.sec('live', 'Live events', `<div class="pfl">${this.liveLeft(staged)}${panel}</div>`);
  },
  /* The module's left column — #pflFrame / #pflUnder / #pflCaps, three grid children with stable ids so

function openProduct(pid, t, flag) {
  const host = Stage.isOpen ? 'stage' : Mom.isOpen ? 'mom' : 'home';
  Card.show(pid, { host, srcEl: t, flag: flag || (host === 'mom' ? 'In this moment' : 'In this look'), round: !!t.closest('.tray-item, .cap-body') });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'home': goHome(); break;
    case 'nav': nav(d.k); break;
    case 'collapse': toggleSidebar(); break;
    case 'stage': { const note = t.closest('.note'); const from = d.from === 'hero' ? $('#hero') : t.classList.contains('card') ? $('.frame', t) : note ? $('.note-media', note) : t; Stage.open(d.s, { from }); if (note) dismissNote(note); break; }
    case 'mom': Mom.open((Profile.isOpen && Profile.data && Profile.data.moments) || MOMS, +d.i); break;  /* a Capsule page opens its own list */
    case 'pfl-day': Profile.wheelTo(d.d); break;
    case 'live-pick': Profile.pickLive(d.event); break;
    case 'tile': Pick.open(d.row, d.k); break;
    case 'ask-try': $('#askIn').value = d.q; $('#askIn').focus(); Ask.input(); break;
    case 'ask-go': Ask.go(); break;
    case 'ask-row': Ask.pick(+d.i); break;
    case 'trend': { const id = d.open, mi = MOMS.findIndex(c => c.media === id); if (mi >= 0) nav('moments'); else if (canEnter(id)) Stage.open(id, { from: $('.tr-img', t) }); break; }
    case 'pk-close': Pick.close(); break;
    case 'profile': Profile.open(d.kind, d.key); break;
    case 'profile-back': Profile.close(); break;
    case 'profile-tab': Profile.go(d.sec); break;
    case 'profile-product': Card.show(d.pid, { host: 'home', flag: d.flag, srcEl: t, round: d.round === '1', event: d.event || '' }); break;
    case 'profile-play': Profile.playVideo(); break;
    case 'song': Profile.playSong(+d.i); break;
    case 'profile-follow': Profile.toggleFollow(t); break;
    case 'piece': openProduct(d.pid, t); break;
    case 'look-piece': Card.show(d.pid, { host: Card.host, cap: Card.cap, flag: 'Completes the look', srcEl: t }); break;
    case 'expand': Card.toggleExpand(); break;
    case 'card-close': Card.close(); break;
    case 'color': Card.pickColor(+d.c); break;
    case 'size': Card.pickSize(d.s); break;
    case 'secure': Card.secure(); break;
    case 'mom-close': Mom.close(); break;
    case 'mom-prev': Mom.go(-1); break;
    case 'mom-next': Mom.go(1); break;
    case 'remind': remind(d.s); break;
    case 'pop': togglePop(d.pop); break;
    case 'note-close': dismissNote(t.closest('.note')); break;
    default: Stage.handle(a, t);
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'chatForm') { e.preventDefault(); Stage.sendChat(); } else if (e.target.id === 'cmForm') { e.preventDefault(); Card.addComment(); } });
document.addEventListener('pointerdown', e => { if (Pop.name && !e.target.closest('#pop, .top-actions')) closePop(); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '');
  if (Card.open && e.key === 'Escape' && !Card.securing && !typing) { e.preventDefault(); Card.close(); return; }
  if (Stage.isOpen) { Stage.key(e, typing); return; }
  if (e.key === 'Escape' && typing) { document.activeElement.blur(); return; }
  if (e.key === 'Escape') {
    if (Pop.name) closePop();
    else if (Mom.isOpen) Mom.close();
    else if (Pick.isOpen) Pick.close();
    else if (Profile.isOpen) Profile.close();
    return;
  }
  if (Mom.isOpen && !typing) { if (e.key === 'ArrowDown') { e.preventDefault(); Mom.go(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); Mom.go(-1); } }
});
$('#phone').addEventListener('click', e => {
  if (!Mom.isOpen || e.target.closest('.capsule, [data-act], button')) return;
  const clip = e.target.closest('.mclip');
  if (!clip || !clip.classList.contains('cur')) return;
  const v = $('video.media', clip);
  if (!v) return;
  if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); }); } else v.pause();
  flashPP($('#momFlash'), !v.paused);
});
$('#phone').addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaY) < 8) return;
  const now = Date.now();
  if (now - Mom.wheelT < 600) return;
  Mom.wheelT = now;
  Mom.go(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

/* Missing files: swap to the poster, else drop the element so the dark frame / tile / circle shows. */
document.addEventListener('error', e => {
  const m = e.target;
  if (!(m instanceof Element)) return;
  if (m.matches('.media, .pimg, .band-img, .cap-prodimg, .cap-shell, #logoSlot img')) mediaFailed(m);
}, true);
document.addEventListener('load', e => {
  const m = e.target;
  if (!(m instanceof Element)) return;
  if (m.matches('.frame>img.media')) m.classList.add('ready');
  else if (m.matches('.cap-shell')) { const b = m.closest('.cap-body'); if (b) b.classList.add('has-render'); }
}, true);
document.addEventListener('visibilitychange', () => { syncHeroVideo(); MomTiles.sync(); });

function init() {
  renderSidebar();
  updateBadges();
  $('#main').innerHTML = homeHTML();
  initRows(document);
  markReady($('#main'));
  MomTiles.observe();
  $('.greet').textContent = greeting();
  markNav('home', false);
  onScroll();
  Stage.init();
  Ask.init();
  Profile.init();
  syncHeroVideo();
  addEventListener('scroll', onScroll, { passive: true });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (innerWidth < 1360 && !state.collapsed) toggleSidebar(true); markNav(null, false); if (Card.open) Card.fit(0); }, 120); });
  const sb = $('#sb');
  sb.addEventListener('mouseover', showTip);
  sb.addEventListener('mouseleave', hideTip);
  if (innerWidth < 1360) toggleSidebar(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { markNav(null, false); });
}
init();
})();
</script>
</body>
</html>
